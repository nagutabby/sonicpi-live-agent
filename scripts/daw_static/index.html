<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonic Pi DAW</title>
<style>
:root{--bg:#14161b;--panel:#1c1f26;--panel2:#252932;--panel3:#2e333e;--line:#343a47;--text:#e6e8ee;--dim:#8b93a3;--acc:#ff6b9d;--cw:20px;--hl:#3a4150}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,"Hiragino Sans",sans-serif;display:flex;flex-direction:column;overflow:hidden}
select,input,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#111;border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
input[type=range]{padding:0;accent-color:var(--acc)}
/* transport */
#top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#top h1{font-size:14px;margin:0 6px 0 0}
#top label{color:var(--dim);display:flex;gap:4px;align-items:center}
#play{width:44px;font-size:16px}
#time{font:600 16px ui-monospace,monospace;background:#0c0d10;padding:3px 10px;border-radius:5px;min-width:92px;text-align:center;color:var(--acc)}
.sep{width:1px;align-self:stretch;background:var(--line)}
#msg{color:var(--acc);font-size:12px}#msg.warn{color:#ffb454}
/* arrangement */
#arr{flex:1;overflow:auto;position:relative;min-height:120px}
#tl{display:block;width:max-content;min-width:100%;position:relative}
.rrow{display:flex;position:sticky;top:0;z-index:5;background:var(--panel)}   /* 小節の行は、再生位置の縦線の下 */
.row2{display:flex}
.rl,.rr{height:26px;background:var(--panel);border-bottom:1px solid var(--line)}
.rl{position:sticky;left:0;z-index:8;width:250px;flex:none;border-right:1px solid var(--line);display:flex;align-items:center;padding:0 8px;color:var(--dim)}
.rr{display:flex}
.bn{cursor:pointer;position:relative;overflow:hidden;white-space:nowrap;height:26px;border-right:2px solid #5b6479;padding:2px 6px;color:var(--dim);font-size:11px;flex:none}
.hd{position:sticky;left:0;z-index:8;width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 8px;height:64px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.hd.sel{background:var(--panel3);box-shadow:inset 3px 0 0 var(--acc)}
.hd .r1,.hd .r2{display:flex;gap:5px;align-items:center}
.hd .nm{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .kd{font-size:10px;color:#111;border-radius:3px;padding:0 4px;font-weight:700}
.hd button{padding:0 6px;font-size:11px;font-weight:700;line-height:18px}
.hd input[type=range]{flex:1;min-width:0}
.hd.gray,.lane.gray{opacity:.38;filter:grayscale(1)}
.lane.dis{pointer-events:none}
.hd.dis button,.hd.dis input{pointer-events:none}
.lane{height:64px;border-bottom:1px solid var(--line);position:relative}
.cells{display:flex;height:100%;padding:6px 0}
.c{width:var(--cw);flex:none;position:relative;background:var(--panel2);border-right:1px solid #1c1f26;user-select:none;cursor:pointer}
.c.bt{border-right-color:#5b6479}.c.br{border-right:2px solid #8a94ab}
.c.al{background:#2a2e39}
.lane.chordl .cells{padding:0}
.cb{height:100%;flex:none;border-right:2px solid #6b7488;padding:6px 10px;cursor:pointer;background:var(--panel2);display:flex;flex-direction:column;justify-content:center}
.cb:hover{background:var(--panel3)}
.cb b{font-size:16px}.cb small{color:var(--dim)}
.nt.sel{outline:2px solid #fff;z-index:3}
.selbox{position:absolute;border:1px dashed #fff;background:#ffffff1f;pointer-events:none;z-index:4}
.nlayer{position:absolute;left:0;right:0;top:50%;height:18px;margin-top:-9px}   /* ドラムの音は、横長のバー */
.sn{position:absolute;top:0;bottom:0;border-radius:3px;border:1px solid #0006;cursor:grab;z-index:2}
.sn:after{content:"";position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize}
.c .f{position:absolute;left:1px;right:0;bottom:0;border-radius:2px 2px 0 0}
.mini{position:absolute;inset:6px 0;pointer-events:none}
.mini i{position:absolute;height:8px;border-radius:3px;border:1px solid #0006}
#ph{position:absolute;top:0;width:2px;will-change:left;background:var(--acc);z-index:6;pointer-events:none;display:none;box-shadow:0 0 6px var(--acc)}
.barctl{position:sticky;right:6px;flex:none;display:flex;gap:4px;align-items:center;margin-left:6px;padding-left:6px;background:var(--panel)}
.barctl button{padding:0 10px}
.bn.sel{background:#ff6b9d33;color:var(--text,#fff)}
.bn.lr{background:#5ec4ff2e;box-shadow:inset 0 -3px 0 #5ec4ff}
.bn .mk{color:var(--acc);font-weight:700;margin-left:4px}
.bn.mkb{box-shadow:inset 3px 0 0 var(--acc)}
.grip{cursor:grab;color:var(--dim);font-size:11px;letter-spacing:-2px;user-select:none}
.hd.dragover{box-shadow:inset 0 3px 0 var(--acc)}
.hd.fxt{box-shadow:inset -3px 0 0 #b48cff}.hd.sel.fxt{box-shadow:inset 3px 0 0 var(--acc),inset -3px 0 0 #b48cff}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px}.kbd b{font:600 12px ui-monospace,monospace;color:var(--acc)}
.selbar{position:absolute;top:0;bottom:0;background:#ff6b9d26;border:1px solid #ff6b9d99;border-top:0;border-bottom:0;pointer-events:none;z-index:3}
.addrow{padding:10px;position:sticky;left:0;z-index:8;width:max-content;max-width:100vw;display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--dim)}
/* bottom */
/* 全画面モード: 下のパネル(エディタ・ライブラリ・コード)を隠して、トラックを広く見せる */
body.fs #bot,body.fs #split{display:none}
#fs.on{background:var(--acc);color:#fff}
#split{height:7px;flex:none;cursor:row-resize;background:var(--line);position:relative;z-index:9}
#split:hover,#split.drag{background:var(--acc)}
#bot{height:330px;display:flex;flex-direction:column;background:var(--panel);border-top:2px solid var(--line);flex:none}
#tabs{display:flex;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--line)}
#tabs button{border-radius:5px 5px 0 0;border-bottom:none}
#pane{flex:1;overflow:hidden;display:flex;min-height:0}
.settings{width:250px;flex:none;padding:10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:7px;overflow:auto}
.settings label{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--dim)}
.settings select,.settings input[type=text]{width:140px}
.settings input[type=range]{width:140px}
#roll{flex:1;overflow:auto;position:relative}
#rollin{position:relative}
.key{position:sticky;left:0;width:48px;z-index:3;height:14px;font-size:10px;color:#333;padding-left:4px;border-bottom:1px solid #00000033;cursor:pointer}
.row{display:flex;height:14px}
.rcell{flex:none;height:14px}
.nt{position:absolute;height:13px;border-radius:3px;border:1px solid #0006;cursor:grab;z-index:2}
.nt:after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;cursor:ew-resize}
#rph{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);z-index:4;pointer-events:none;display:none}
pre{margin:0;padding:10px;overflow:auto;font-size:11px;color:#c9d1e0;flex:1;white-space:pre}
.pop{position:fixed;z-index:50;background:var(--panel3);border:1px solid var(--acc);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 30px #000a;max-width:380px}
.pop .g{display:flex;gap:4px;flex-wrap:wrap}
.pop button{min-width:54px;padding:4px 6px}
.pop small{color:var(--dim)}
.hint{color:var(--dim);font-size:12px}
.ov{position:fixed;inset:0;background:#000b;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.ovp{background:var(--panel);border:1px solid var(--acc);border-radius:10px;width:min(820px,100%);max-height:100%;overflow:auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ovp h2{grid-column:1/-1;margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.ovp .fm{display:flex;flex-direction:column;gap:8px}
.ovp label{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--dim)}
.ovp label input[type=text],.ovp label select{width:210px}
.ovp textarea{width:100%;height:250px;background:#0c0d10;color:#c9d1e0;border:1px solid var(--line);border-radius:6px;font:12px/1.5 ui-monospace,monospace;padding:8px}
.ovp .bt{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.spop{position:fixed;z-index:90;width:380px;max-height:440px;background:var(--panel3);border:1px solid var(--acc);border-radius:8px;display:flex;flex-direction:column;gap:6px;padding:8px;box-shadow:0 8px 30px #000a}
.spop input{width:100%}
.spop .chips{display:flex;flex-wrap:wrap;gap:4px}
.spop .chips button{padding:1px 8px;font-size:11px;border-radius:10px}
.spop .list{overflow:auto;flex:1;min-height:120px;display:flex;flex-direction:column}
.srow{padding:4px 8px;border-radius:5px;cursor:pointer;display:flex;flex-direction:column;border-left:3px solid transparent}
.srow:hover{background:var(--panel2)}.srow.on{background:#ff6b9d33;border-left-color:var(--acc)}
.srow b{font:600 12px ui-monospace,monospace}.srow small{color:var(--dim);font-size:11px}
@media(max-width:700px){.ovp{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="top">
  <h1>Sonic Pi DAW</h1>
  <button id="play" title="再生/停止(スペース)。再生位置から Sonic Pi の本物の音で鳴ります(スピーカーから音が出ます)">▶</button>
  <div id="time">1.1.1</div>
  <span id="msg"></span>
  <label>BPM <input id="bpm" type="number" min="40" max="240" style="width:64px"></label>
  <label>キー <select id="kroot"></select><select id="kscale"><option value="major">メジャー</option><option value="minor">マイナー</option></select></label>
  <label><input id="loop" type="checkbox" checked> ループ</label>
  <button id="lrange" hidden title="ループ範囲を解除(⇧+クリックで小節を 2 つ選ぶと範囲になります)"></button>
  <label>スナップ <select id="snap"><option value="4">1拍</option><option value="2">1/2拍</option><option value="1" selected>1/4拍</option></select></label>
  <label>並び <button id="sortasc" title="ドラム → ベース → コード → メロディ → エフェクトの順に固定して、名前の昇順に並べ替える">▲ 昇順</button><button id="sortdesc" title="ドラム → ベース → コード → メロディ → エフェクトの順に固定して、名前の降順に並べ替える">▼ 降順</button></label>
  <label>幅 <button id="zout" title="縮小(Ctrl+ホイールでも)">－</button><button id="zin" title="拡大(Ctrl+ホイールでも)">＋</button></label>
  <span class="sep"></span>
  <label>曲 <select id="proj"></select></label>
  <button id="new">新規</button>
  <label>プリセット <select id="preset"></select></label>
  <button id="psave" title="いまの曲を、トラックの音色・パターン・コード進行ごと保存">💾 プリセット保存</button>
  <span class="sep"></span>
  <button id="fs" title="全画面モード(F): 下のタブを隠して、トラックを広く見せる">⛶</button>
  <button id="help" title="ショートカット一覧">？</button>
</div>
<div id="arr"><div id="tl"></div><div id="ph"></div></div>
<div id="split" title="ドラッグで、下のパネルの高さを変える(ダブルクリックで元の高さ)"></div>
<div id="bot">
  <div id="tabs"></div>
  <div id="pane"></div>
</div>
<audio id="audio" preload="auto"></audio>
<script>
'use strict';
const $ = s => document.querySelector(s);
const h = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else if (k.startsWith('on')) e[k] = v; else e[k] = v; } e.append(...kids.filter(x => x != null)); return e; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const KIND = { drum: ['ドラム', '#ff8f6b'], bass: ['ベース', '#ff6b9d'], chord: ['コード', '#ffd166'], melody: ['メロディ', '#5ec4ff'], fx: ['エフェクト', '#b48cff'] };
const SUF = { major: '', minor: 'm', major7: 'maj7', minor7: 'm7', dom7: '7', sus2: 'sus2', sus4: 'sus4', diminished: 'dim', m9: 'm9', major9: 'maj9', add9: 'add9' };
const TYPE_LABEL = { major: 'メジャー', minor: 'マイナー', major7: 'maj7', minor7: 'm7', dom7: '7', sus2: 'sus2', sus4: 'sus4', diminished: 'dim', m9: 'm9', major9: 'maj9', add9: 'add9' };
const PCN = { c: 'C', cs: 'C#', d: 'D', eb: 'Eb', e: 'E', f: 'F', fs: 'F#', g: 'G', ab: 'Ab', a: 'A', bb: 'Bb', b: 'B' };
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10] };
const CELLS_PER_BEAT = 4;
let knownVersion = null, pendingSave = false, cat = null, P = null, selId = null, tab = 'edit', saveT = null, counter = 1;
const chordName = c => c ? PCN[c[0]] + SUF[c[1]] : '';   // null = コードなし(空の小節)
const RECQ = new URLSearchParams(location.search);   // ?rec=1&project=名前&bar=開始小節&bars=小節数: 録画用。自動で再生を始める(record_video.py が使う)
let REC_FLAG = null;   // 録画の合図: 再生が始まる瞬間まで左上に出る白い四角。この四角が消えたフレームを、音の頭に合わせる
const MAX_BARS = 128;   // daw_codegen.MAX_BARS と同じ
const cellsBar = () => CELLS_PER_BEAT * P.meter;
const totalCells = () => P.bars * cellsBar();

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
  if (body && j.version) knownVersion = j.version;   // 自分の書き込みでは、ホットリロードしない
  return j;
}
const say = (t, warn) => { const m = $('#msg'); m.textContent = t || ''; m.className = warn ? 'warn' : ''; };

/* ---------- project ---------- */
const rep = (s, n, ch = '.') => s.padEnd(n, ch).slice(0, n);
let stems = [], presets = [];
let zoom = 1, snapC = 1, cursor = 0, loopR = null, loopPend = null, dragTid = null;   // 表示の拡大率 / スナップ(マス) / 再生位置(マス) / ループ範囲(小節) / 並べ替え中のトラック
try { zoom = clamp(+localStorage.getItem('zoom') || 1, .4, 4); } catch (e) { /* 無視 */ }
const colorOf = t => t.color || KIND[t.kind][1];
const loadPresets = async () => { presets = (await api('/api/presets')).presets; };
function applyPreset(pr) {
  if (!confirm(`プリセット「${pr.name}」で、いまの曲(BPM・コード進行・全トラック)を置き換えます。よろしいですか?`)) return;
  const keep = P.name, np = normSteps(JSON.parse(JSON.stringify(pr.project)));
  P = { ...np, name: keep }; selId = P.tracks[0]?.id; counter = 1 + Math.max(0, ...P.tracks.map(t => +t.id.replace(/\D/g, '') || 0));
  Audio_.stop(); dirty(); render(); renderBottom(); say(`プリセット「${pr.name}」を読み込みました`);
}
async function savePreset() {
  const name = (prompt('プリセット名(いまの曲を、トラックの音色・パターン・コード進行ごと保存します)', P.name) || '').trim();
  if (!name) return;
  const preset = { name, project: P };
  try {
    try { await api('/api/preset', { preset }); } catch (e) { if (!/登録済み/.test(e.message) || !confirm(e.message.replace(/。.*/, '') + '。上書きしますか?')) throw e; await api('/api/preset', { preset, overwrite: true }); }
    await loadPresets(); fillPresets(); say(`プリセット「${name}」を保存しました(presets/)`);
  } catch (e) { say(e.message, 1); }
}
function fillPresets() {
  const sel = $('#preset'); sel.textContent = ''; sel.append(new Option('プリセットを読み込む…', ''));
  presets.forEach(pr => sel.append(new Option(pr.name, pr.id)));
}
const normSteps = P0 => { for (const t of P0.tracks) if (t.steps) t.steps = t.steps.replace(/[xo1-9]/g, 'X'); return P0; };   // 音の強さは廃止: 音はすべて X
const loadStems = async () => { stems = (await api('/api/stems')).stems; };
function uniqueName(n) { let k = 2, c = n; while (P.tracks.some(t => t.name === c)) c = n + ' ' + k++; return c; }
// stem(登録済みの音色の雛形)から、空のトラックを作る
function trackFromStem(st) {
  const id = st.kind + (counter++), bars = P.bars, cb = cellsBar();
  const t = { id, name: uniqueName(st.name), kind: st.kind, mute: false, solo: false, voice: st.kind === 'fx' ? JSON.parse(JSON.stringify(st.voice)) : { pan: 0, cutoff: 100, env: 'stab', ...st.voice } };
  if (st.kind === 'fx') { t.targets = []; if (st.voice.name === 'sidechain') t.steps = '.'.repeat(bars * cb); }
  else if (st.kind === 'drum') t.steps = '.'.repeat(bars * cb); else t.notes = [];   // stem は必ず空のトラックとして追加する
  return t;
}
function addStem(st) { const t = trackFromStem(st); P.tracks.push(t); selId = t.id; dirty(); render(); renderBottom(); }
function starter() {
  P = { name: 'my_song', bpm: 110, bars: 4, meter: 4, key: { root: 'c', scale: 'minor' }, prog: [], tracks: [] };
  P.prog = Array.from({ length: P.bars }, () => [P.key.root, P.key.scale]);   // 最初は全小節がキーの主和音。コードは小節ごとに自分で選ぶ
  for (const id of ['kick', 'hat_8th', 'bass_root', 'chord_pad']) { const st = stems.find(x => x.id === id); if (st) P.tracks.push(trackFromStem(st)); }
  selId = P.tracks[0]?.id; resetHistory();
}
const ROOTS = () => cat.roots;
function moveTrack(from, to) {
  if (!from || from === to) return;
  const a = P.tracks.findIndex(x => x.id === from), b = P.tracks.findIndex(x => x.id === to); if (a < 0 || b < 0) return;
  const [t] = P.tracks.splice(a, 1); P.tracks.splice(b, 0, t); lastEdit = 0; dirty(); render();
}
/* トラックの並べ替え: まずグループの順(ドラム → ベース → コード → メロディ → エフェクト)に固定し、そのなかで名前順(dir = 1 昇順 / -1 降順)。
   注意: エフェクトは並び順で掛かる順番が変わる(先頭が最初に音を受ける)ので、エフェクト同士を並べ替えると音が変わることがある */
const GROUP_ORDER = ['drum', 'bass', 'chord', 'melody', 'fx'];
function sortTracks(dir) {
  const gi = t => { const i = GROUP_ORDER.indexOf(t.kind); return i < 0 ? GROUP_ORDER.length : i; };
  const sorted = [...P.tracks].sort((a, b) => gi(a) - gi(b) || dir * String(a.name).localeCompare(String(b.name), 'ja', { numeric: true }));
  if (sorted.every((t, k) => t === P.tracks[k])) { say(dir > 0 ? 'すでに昇順です' : 'すでに降順です'); return; }
  const fxMoved = P.tracks.filter(t => t.kind === 'fx').some((t, k) => t !== sorted.filter(x => x.kind === 'fx')[k]);
  P.tracks = sorted; lastEdit = 0; dirty(); render();
  say(`ドラム → ベース → コード → メロディ → エフェクトの順に固定して、名前の${dir > 0 ? '昇順' : '降順'}に並べ替えました(⌘Z で戻せます)` + (fxMoved ? '。エフェクトの順番が変わったので、音が変わる場合があります' : ''), fxMoved);
}
function setBars(n) { fitBars(n); lastEdit = 0; dirty(); render(); renderBottom(); }
function fitBars(n) {
  const old = P.bars, cb = cellsBar(); P.bars = n;
  while (P.prog.length < n) P.prog.push(null);   // 増えた小節は空(コードなし)
  P.prog.length = n; P.markers = (P.markers || []).filter(m => m.bar < n);
  for (const t of P.tracks) {
    if (t.steps != null) t.steps = (t.steps + '.'.repeat(Math.max(n - old, 0) * cb)).slice(0, n * cb);
    else if (t.notes) t.notes = t.notes.filter(x => x[0] < n * P.meter).map(x => [x[0], x[1], Math.min(x[2], n * P.meter - x[0])]);
  }
}
function persist() { pendingSave = true; clearTimeout(saveT); say('編集中…'); saveT = setTimeout(save, 700); }
/* 元に戻す / やり直す(⌘Z / ⌘⇧Z・⌘Y): 曲全体のスナップショット。連続した操作(ドラッグ・スライダー)は 0.5 秒以内なら 1 回にまとめる */
let hist = [], future = [], snap = null, lastEdit = 0;

{   // 下のパネル(エディタ・ライブラリ・コード)の高さを、ドラッグで変える

async function pollVersion() {
  try {
    const { version } = await api('/api/version');
    if (knownVersion === null) knownVersion = version;
    else if (version !== knownVersion && !pendingSave) { try { sessionStorage.setItem('daw_sel', JSON.stringify({ sel: selId, tab })); } catch (e) { /* 無視 */ } location.reload(); return; }
  } catch (e) { /* サーバー再起動中。つながったら version が変わっている */ }

}
